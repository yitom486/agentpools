name: Build and test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  node:
    name: Node ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install Node dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build ACP mock agent
        run: cargo build -p agentpools-acp --features test-support --bin agentpools-acp-mock-agent --locked
      - name: Build native addon
        working-directory: bindings/node
        run: npm run build -- --target '${{ matrix.target }}'
      - name: Test Node API with mock ACP
        working-directory: bindings/node
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/agentpools.*.node
          if-no-files-found: error

  python:
    name: Python ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out dist
      - name: Build ACP mock agent
        run: cargo build -p agentpools-acp --features test-support --bin agentpools-acp-mock-agent --locked
      - name: Install built wheel
        run: python -m pip install --no-deps bindings/python/dist/*.whl
      - name: Test Python API with mock ACP
        run: python -m unittest discover -s bindings/python/test -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
