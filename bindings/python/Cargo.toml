[package]
name = "agentpools-python"
version = "0.1.0"
edition = "2024"
publish = false
include = ["Cargo.toml", "src/**"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
agentpools = { path = "../.." }
agentpools-acp = { path = "../../crates/agentpools-acp" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
