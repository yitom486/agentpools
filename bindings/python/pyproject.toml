[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "agentpools"
version = "0.1.3"
description = "Bounded multi-runtime agent session pools for Python"
requires-python = ">=3.9"
readme = "README.md"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "agentpools._native"
