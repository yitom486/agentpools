[package]
name = "agentpools-codex"
version = "0.1.7"
edition = "2024"
description = "Codex app-server adapter for agentpools with standalone, shared multiplexing, and ephemeral session cleanup"
readme = "README.md"

[dependencies]
agentpools = { version = "0.1.7", path = "../.." }
agentpools-transport = { version = "0.1.7", path = "../agentpools-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
