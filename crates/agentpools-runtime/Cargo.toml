[package]
name = "agentpools-runtime"
version = "0.1.10"
edition = "2024"
description = "Runtime adapters and versioned binding configuration for agentpools"
license = "MIT"
repository = "https://github.com/yitom486/agentpools"
readme = "README.md"

[dependencies]
agentpools = { version = "0.1.10", path = "../.." }
agentpools-acp = { version = "0.1.10", path = "../agentpools-acp" }
agentpools-codex = { version = "0.1.10", path = "../agentpools-codex" }
agentpools-transport = { version = "0.1.10", path = "../agentpools-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "mock_runtime"
path = "tests/bin/mock_runtime.rs"
